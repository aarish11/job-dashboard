<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5C4F">
<title>Job Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF2F1; --surface: #FFFFFF; --sunk: #F5F8F7; --ink: #16302B; --muted: #5E716C; --line: #D3DCD9;
  --primary: #0F5C4F; --primary-ink: #FFFFFF; --primary-soft: #DCEBE7;
  --gulf: #B8791E; --india: #4B4FB0; --europe: #1E7C99; --apac: #9C3F6E; --canada: #5E7F2C; --multi: #8A9A96;
  --ok: #2F7A4A; --warn: #A5620F; --bad: #B4372D;
  --r-sm: 6px; --r-md: 12px; --r-lg: 18px;
  --shadow: 0 1px 2px rgba(22, 48, 43, .06), 0 8px 24px rgba(22, 48, 43, .08);
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1A18; --surface: #172522; --sunk: #13201D; --ink: #E4EDEA; --muted: #8FA39E; --line: #2A3C38;
    --primary: #5FC2AA; --primary-ink: #0B1F1A; --primary-soft: #1D3A33;
    --gulf: #E0A85A; --india: #9A9DF2; --europe: #62BCD6; --apac: #E58BB6; --canada: #A6C76A; --multi: #6F827E;
    --ok: #74C894; --warn: #E4A653; --bad: #F08A80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1A18; --surface: #172522; --sunk: #13201D; --ink: #E4EDEA; --muted: #8FA39E; --line: #2A3C38;
  --primary: #5FC2AA; --primary-ink: #0B1F1A; --primary-soft: #1D3A33;
  --gulf: #E0A85A; --india: #9A9DF2; --europe: #62BCD6; --apac: #E58BB6; --canada: #A6C76A; --multi: #6F827E;
  --ok: #74C894; --warn: #E4A653; --bad: #F08A80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body); }
a { color: var(--primary); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--cond); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- Sign-in ---------- */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; background:
  linear-gradient(var(--paper), var(--paper)) padding-box; }
.login-box { width: min(100%, 380px); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 14px; }
.login-mark { display: flex; gap: 4px; }
.login-mark span { width: 28px; height: 6px; border-radius: 3px; }
.login h1 { font: 700 1.9rem/1.1 var(--cond); margin: 0; letter-spacing: -.01em; }
.login p { margin: 0; }
.field { display: grid; gap: 6px; font-size: .9rem; color: var(--muted); }
.field input { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--sunk); color: var(--ink); font-size: 1rem; }
.check { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-sm); border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.on { background: var(--primary-soft); color: var(--ink); border-color: var(--primary); }
.err { color: var(--bad); min-height: 1.3em; font-size: .9rem; }

/* ---------- Shell ---------- */
.shell { max-width: 1240px; margin: 0 auto; padding: 18px 20px 40px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.brand { font: 700 1.5rem/1 var(--cond); margin: 0; letter-spacing: -.01em; }
.brand small { display: block; font: 400 .8rem/1.4 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 4px; }
.top-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
.regions { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.regions button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
.regions button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.search { position: relative; }
.search input { width: 230px; padding: 8px 12px 8px 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.kbd { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.tabs { display: flex; gap: 2px; margin: 18px 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected=true] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.badge { font: 600 .75rem/1 var(--cond); background: var(--primary-soft); color: var(--ink); padding: 3px 7px; border-radius: 999px; }

/* ---------- Pipeline strip (the signature piece) ---------- */
.pipeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.stage { position: relative; border: 0; background: transparent; text-align: left; padding: 16px 16px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.stage + .stage { border-left: 1px solid var(--line); }
.stage:not(:last-child)::after { content: ""; position: absolute; right: -7px; top: 22px; width: 12px; height: 12px; background: var(--surface); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: rotate(45deg); z-index: 1; }
.stage:hover { background: var(--sunk); }
.stage:hover::after { background: var(--sunk); }
.stage .label { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .big { font: 700 2.4rem/1 var(--cond); letter-spacing: -.02em; }
.stage.zero .big { color: var(--muted); opacity: .55; }
.lane { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.lane span { display: block; height: 100%; }
.stage .hint { font-size: .78rem; color: var(--muted); min-height: 1.2em; }
@media (prefers-reduced-motion: no-preference) {
  .pipeline.play .stage .big, .pipeline.play .lane { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .pipeline.play .stage:nth-child(2) .big, .pipeline.play .stage:nth-child(2) .lane { animation-delay: .05s; }
  .pipeline.play .stage:nth-child(3) .big, .pipeline.play .stage:nth-child(3) .lane { animation-delay: .1s; }
  .pipeline.play .stage:nth-child(4) .big, .pipeline.play .stage:nth-child(4) .lane { animation-delay: .15s; }
  .pipeline.play .stage:nth-child(5) .big, .pipeline.play .stage:nth-child(5) .lane { animation-delay: .2s; }
  .pipeline.play .stage:nth-child(6) .big, .pipeline.play .stage:nth-child(6) .lane { animation-delay: .25s; }
  .pipeline.play .stage:nth-child(7) .big, .pipeline.play .stage:nth-child(7) .lane { animation-delay: .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

/* ---------- Region cards ---------- */
.region-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 18px 0; }
.rcard { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px 16px; text-align: left; display: grid; gap: 10px; border-top: 4px solid var(--c); }
.rcard[aria-pressed=true] { outline: 2px solid var(--c); outline-offset: -1px; }
.rcard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rcard-head strong { font: 600 1.15rem/1.2 var(--cond); }
.rcard-head span { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rcard dl { margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rcard dt { font-size: .76rem; color: var(--muted); }
.rcard dd { margin: 0; font: 700 1.5rem/1.1 var(--cond); }

/* ---------- Panels and lists ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--line); padding: 16px; min-width: 0; }
.panel h2 { font: 600 1.15rem/1.25 var(--cond); margin: 0; }
.panel .sub { font-size: .86rem; color: var(--muted); margin: 4px 0 12px; max-width: 72ch; }
.panel + .panel { margin-top: 18px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; border-radius: 0; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--sunk); }
.row .bar { width: 6px; align-self: stretch; border-radius: 3px; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row .m { font-size: .86rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { display: flex; align-items: center; gap: 8px; }
.row .when { font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.star { border: 0; background: none; padding: 4px; color: var(--muted); line-height: 0; border-radius: 6px; }
.star[aria-pressed=true] { color: var(--gulf); }
.pill { display: inline-block; font-size: .76rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.muted { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; padding: 2px 8px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); white-space: nowrap; }
.score { font: 700 1.35rem/1 var(--cond); min-width: 2ch; text-align: right; }
.empty { border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 18px; color: var(--muted); }
.more { margin-top: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .86rem; color: var(--muted); }
.chip[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.controls select { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); max-width: 100%; }
.count { font-size: .84rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

/* Hiring bars */
.hbars { display: grid; gap: 4px; }
.hbar { display: grid; grid-template-columns: minmax(0, 9rem) 1fr 2.6rem; gap: 10px; align-items: center; padding: 5px 6px; border: 0; background: transparent; text-align: left; border-radius: var(--r-sm); font-size: .88rem; }
.hbar:hover { background: var(--sunk); }
.hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .tr { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunk); }
.hbar .tr span { display: block; height: 100%; }
.hbar .n { text-align: right; font: 600 1rem/1 var(--cond); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Application board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.col { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px; scroll-snap-align: start; min-height: 120px; }
.col h3 { font: 600 1rem/1.2 var(--cond); margin: 2px 4px 10px; display: flex; justify-content: space-between; }
.col h3 .num { color: var(--muted); }
.tile { display: grid; gap: 4px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--r-sm); padding: 9px 10px; margin-bottom: 8px; }
.tile:hover { border-color: var(--primary); border-left-color: var(--c); }
.tile .t { font-weight: 600; font-size: .92rem; }
.tile .m { font-size: .8rem; color: var(--muted); }

/* Company list */
.co-row { display: grid; grid-template-columns: minmax(0, 1.6fr) 3rem minmax(0, 1fr) minmax(0, 1.1fr) 3.5rem; gap: 10px; align-items: center; padding: 9px 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: left; font-size: .9rem; }
.co-row:hover { background: var(--sunk); }
.co-row.head { font-size: .8rem; color: var(--muted); cursor: default; }
.co-row.head:hover { background: transparent; }
.co-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-row .rg { display: flex; gap: 4px; }
.co-row .roles { text-align: right; font: 600 1rem/1 var(--cond); }

textarea.prompt { width: 100%; min-height: 260px; font: .82rem/1.5 ui-monospace, Consolas, monospace; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--sunk); color: var(--ink); }

/* ---------- Detail drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 18, .35); z-index: 40; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; border-top: 5px solid var(--c, var(--primary)); }
.drawer h2 { font: 700 1.35rem/1.2 var(--cond); margin: 0; }
.drawer .close { position: absolute; top: 14px; right: 14px; border: 0; background: var(--sunk); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; }
.drawer .body { padding: 16px 20px; overflow: auto; display: grid; gap: 16px; align-content: start; }
.drawer dl { display: grid; grid-template-columns: 8rem 1fr; gap: 8px 12px; margin: 0; font-size: .92rem; }
.drawer dt { color: var(--muted); }
.drawer dd { margin: 0; }
.drawer .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); margin-top: auto; }
.why { background: var(--sunk); border-radius: var(--r-sm); padding: 12px; font-size: .92rem; }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .22s cubic-bezier(.2,.7,.2,1); }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}

footer { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .82rem; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 999px; font-size: .88rem; z-index: 60; box-shadow: var(--shadow); }


/* ---------- Scan window ---------- */
.modal { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: min(86vh, 760px); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.modal-scrim { position: fixed; inset: 0; background: rgba(10, 20, 18, .45); z-index: 50; }
.modal header { padding: 18px 20px 10px; display: grid; gap: 4px; position: relative; }
.modal h2 { font: 700 1.4rem/1.2 var(--cond); margin: 0; }
.modal .close { position: absolute; top: 14px; right: 14px; border: 0; background: var(--sunk); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; }
.modal .body { padding: 6px 20px 14px; overflow: auto; display: grid; gap: 16px; }
.modal footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 0; color: var(--ink); font-size: .9rem; }
.step-label { font-weight: 600; margin-bottom: 8px; display: block; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-row .chip { display: inline-flex; align-items: center; gap: 6px; }
.co-pick { border: 1px solid var(--line); border-radius: var(--r-sm); max-height: 240px; overflow: auto; }
.co-pick label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: .92rem; cursor: pointer; }
.co-pick label:last-child { border-bottom: 0; }
.co-pick label:hover { background: var(--sunk); }
.co-pick .meta { font-size: .78rem; color: var(--muted); }
.co-search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--sunk); margin-bottom: 8px; }
.progress { display: grid; gap: 10px; }
.pstep { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: .95rem; }
.pstep .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; }
.pstep.done .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.pstep.now .mark { border-color: var(--primary); border-top-color: transparent; }
.pstep.fail .mark { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.pstep .t2 { font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .pstep.now .mark { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.note { background: var(--sunk); border-radius: var(--r-sm); padding: 12px; font-size: .9rem; }
.note ol { margin: 6px 0 0; padding-left: 20px; }
.note code { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: .85rem; }
@media (max-width: 640px) { .modal { top: auto; bottom: 0; transform: translateX(-50%); width: 100%; border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 92vh; } .modal footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); } }

/* ---------- Bottom nav (phones) ---------- */
.bottom-nav { display: none; }
@media (max-width: 860px) {
  .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stage:nth-child(5) { border-left: 0; }
  .stage:hover { background: transparent; }
  .stage:nth-child(n+5) { border-top: 1px solid var(--line); }
  .stage:nth-child(4)::after { display: none; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  .shell { padding: 14px 14px calc(84px + env(safe-area-inset-bottom)); }
  .top-tools { margin-left: 0; width: 100%; }
  .search { flex: 1; }
  .search input { width: 100%; }
  .kbd { display: none; }
  #run-scan { order: 3; }
  .tabs { display: none; }
  .regions { width: 100%; overflow-x: auto; scrollbar-width: none; }
  .regions button { flex: 1 0 auto; justify-content: center; padding: 7px 10px; }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
  .stage { padding: 12px; }
  .stage::after { display: none; }
  .stage + .stage { border-left: 0; }
  .stage:first-child { grid-column: 1 / -1; }
  .stage:nth-child(odd):not(:first-child) { border-left: 1px solid var(--line); }
  .stage:nth-child(n+2) { border-top: 1px solid var(--line); }
  .stage .big { font-size: 2rem; }
  .region-row { grid-template-columns: 1fr; gap: 10px; }
  .co-row { grid-template-columns: minmax(0, 1fr) 2.6rem 3rem; }
  .co-row > :nth-child(3), .co-row > :nth-child(4) { display: none; }
  .row { grid-template-columns: 5px minmax(0, 1fr) auto; gap: 10px; }
  .row .when { display: none; }
  .drawer { top: auto; left: 0; width: 100%; max-height: 88vh; border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .drawer dl { grid-template-columns: 6.5rem 1fr; }
  .drawer .actions { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  @media (prefers-reduced-motion: no-preference) { .drawer { animation: up .25s cubic-bezier(.2,.7,.2,1); } @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } } }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: .7rem; color: var(--muted); padding: 4px 0; }
  .bottom-nav button svg { width: 22px; height: 22px; }
  .bottom-nav button[aria-selected=true] { color: var(--primary); font-weight: 600; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div id="login" class="login">
  <form class="login-box" id="login-form" onsubmit="return false">
    <div class="login-mark" aria-hidden="true"><span style="background:var(--gulf)"></span><span style="background:var(--india)"></span><span style="background:var(--europe)"></span><span style="background:var(--apac)"></span><span style="background:var(--canada)"></span></div>
    <h1>Job Dashboard</h1>
    <p class="muted">Your job search across the Gulf, India, Europe, Asia-Pacific and Canada. Sign in to unlock it.</p>
    <label class="field">Username<input type="text" id="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="field">Password<input type="password" id="pw" autocomplete="current-password"></label>
    <label class="check"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
    <button class="btn" id="unlock" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="shell">
    <header class="top">
      <h1 class="brand">Job Dashboard<small id="scan-line"></small></h1>
      <div class="top-tools">
        <div class="regions" role="group" aria-label="Region" id="regions"></div>
        <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="q" placeholder="Search jobs and companies" aria-label="Search jobs and companies"></label>
        <span class="kbd" aria-hidden="true">/</span>
        <button class="btn" id="run-scan" type="button">Run a scan</button>
      </div>
    </header>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <main id="view"></main>
    <footer><span id="gen-line"></span><span><button class="btn quiet" id="lock" type="button">Sign out</button></span></footer>
  </div>
  <nav class="bottom-nav" role="tablist" id="bottom-nav" aria-label="Pages"></nav>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>

<script>
(() => {
  const STORE_KEY = 'jobdash-key-v1', SAVED_KEY = 'jobdash-saved-v1', HIDDEN_KEY = 'jobdash-hidden-v1';
  const REGIONS = [
    { id: 'Gulf', tz: 'Asia/Dubai', city: 'Dubai', color: 'var(--gulf)' },
    { id: 'India', tz: 'Asia/Kolkata', city: 'Delhi', color: 'var(--india)' },
    { id: 'Europe', tz: 'Europe/Luxembourg', city: 'Luxembourg', color: 'var(--europe)' },
    { id: 'APAC', tz: 'Asia/Singapore', city: 'Singapore', color: 'var(--apac)' },
    { id: 'Canada', tz: 'America/Toronto', city: 'Toronto', color: 'var(--canada)' },
  ];
  const RCOLOR = { Gulf: 'var(--gulf)', India: 'var(--india)', Europe: 'var(--europe)', APAC: 'var(--apac)', Canada: 'var(--canada)' };
  const rc = (r) => RCOLOR[r] || 'var(--multi)';
  const TABS = [
    { id: 'today', label: 'Today', icon: '<path d="M3 12h4l3 8 4-16 3 8h4"/>' },
    { id: 'open', label: 'Open roles', icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' },
    { id: 'apps', label: 'My applications', short: 'Applied', icon: '<path d="M9 11l3 3L21 5"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
    { id: 'companies', label: 'Companies', icon: '<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>' },
    { id: 'chatgpt', label: 'ChatGPT handoff', short: 'ChatGPT', icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
  ];
  const state = { tab: 'today', region: 'All', q: '', data: null, f: {}, limit: {}, played: false };
  let saved = new Set(), hidden = new Set();

  // ---------- small helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'html') n.innerHTML = v; // only ever used with constant SVG markup
      else n.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach((c) => c != null && c !== false && n.append(c.nodeType ? c : document.createTextNode(String(c))));
    return n;
  };
  const svg = (paths, size = 18) => h('span', { 'aria-hidden': 'true', style: { lineHeight: 0, display: 'inline-flex' }, html: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>` });
  const STAR = '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>';
  const fmt = (n) => (n == null || n === '' ? '–' : Number(n).toLocaleString('en-IN'));
  const day = (iso) => { if (!iso) return ''; const d = new Date(String(iso).length <= 10 ? iso + 'T00:00:00Z' : iso); return isNaN(d) ? String(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); };
  const when = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' IST'; };
  const clock = (tz) => new Date().toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
  const safe = (u) => (u && /^https?:\/\//i.test(u) ? u : null);
  const inRegion = (r) => state.region === 'All' || r.region === state.region || (r.regions || '').includes(state.region);
  const matchQ = (...f) => { const q = state.q.trim().toLowerCase(); return !q || f.join(' ').toLowerCase().includes(q); };
  const load = (k) => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
  const store = (k, set) => { try { localStorage.setItem(k, JSON.stringify([...set])); } catch (e) { /* storage off: keeps for this visit */ } };
  let toastT = null;
  const toast = (msg) => { document.querySelectorAll('.toast').forEach((t) => t.remove()); const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); };
  const grp = (s) => { s = String(s || ''); if (s.startsWith('Rejected')) return 'Rejected'; return s; };

  // ---------- decryption ----------
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let payloadP = null;
  const getPayload = () => (payloadP ||= fetch('data.enc.json', { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('data'); return r.json(); }));
  async function deriveKey(secret, p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key, p) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct));
    state.data = JSON.parse(new TextDecoder().decode(plain));
    saved = load(SAVED_KEY); hidden = load(HIDDEN_KEY);
    $('#login').hidden = true; $('#app').hidden = false;
    render();
  }
  async function tryStored() {
    let raw = null; try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return;
    try {
      const p = await getPayload(); const s = JSON.parse(raw);
      if (s.salt !== p.salt) throw new Error('stale');
      await open(await crypto.subtle.importKey('raw', b64(s.k), { name: 'AES-GCM' }, true, ['decrypt']), p);
    } catch (e) { try { localStorage.removeItem(STORE_KEY); } catch (e2) { /* ignore */ } }
  }
  $('#login-form').addEventListener('submit', async () => {
    const user = $('#user').value.trim().toLowerCase(), pw = $('#pw').value; $('#err').textContent = '';
    if (!user || !pw) { $('#err').textContent = 'Enter your username and password.'; return; }
    const btn = $('#unlock'); btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const p = await getPayload(); const key = await deriveKey(user + '\n' + pw, p);
      await open(key, p);
      if ($('#remember').checked) { const k = new Uint8Array(await crypto.subtle.exportKey('raw', key)); try { localStorage.setItem(STORE_KEY, JSON.stringify({ salt: p.salt, k: btoa(String.fromCharCode(...k)) })); } catch (e) { /* stays signed in for this visit */ } }
      $('#pw').value = ''; $('#user').value = '';
    } catch (e) { $('#err').textContent = e.message === 'data' ? 'The data did not load. Check your connection and reload the page.' : 'Wrong username or password.'; }
    finally { btn.disabled = false; btn.textContent = 'Sign in'; }
  });
  $('#lock').addEventListener('click', () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } state.data = null; closeDrawer(); $('#view').replaceChildren(); $('#app').hidden = true; $('#login').hidden = false; });

  // ---------- chrome ----------
  function chrome() {
    const regions = $('#regions'); regions.replaceChildren(
      h('button', { type: 'button', 'aria-pressed': String(state.region === 'All'), onclick: () => setRegion('All') }, 'All'),
      ...REGIONS.map((r) => h('button', { type: 'button', 'aria-pressed': String(state.region === r.id), onclick: () => setRegion(r.id) }, h('span', { class: 'dot', style: { background: r.color } }), r.id)));
    const counts = tabCounts();
    $('#tabs').replaceChildren(...TABS.map((t) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(state.tab === t.id), onclick: () => go(t.id) }, t.label, counts[t.id] != null ? h('span', { class: 'badge' }, fmt(counts[t.id])) : null)));
    $('#bottom-nav').replaceChildren(...TABS.map((t) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(state.tab === t.id), onclick: () => go(t.id) }, svg(t.icon, 22), t.short || t.label)));
    const d = state.data, m = d.scan_meta && d.scan_meta[0];
    $('#scan-line').textContent = m ? `Last scan ${when(m.started)}. Next automatic scan ${nextScan()}` : '';
    $('#gen-line').textContent = `Site updated ${when(d.generated)}. Saved and hidden jobs are remembered on this device only.`;
  }
  function nextScan() {
    // Automatic scans run at about 08:25 and 19:25 India time (GitHub may start them a few minutes late).
    const now = new Date(), ist = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
    const mins = ist.getHours() * 60 + ist.getMinutes();
    if (mins < 8 * 60 + 25) return 'today about 08:25 IST';
    if (mins < 19 * 60 + 25) return 'today about 19:25 IST';
    return 'tomorrow about 08:25 IST';
  }
  function tabCounts() {
    const d = state.data;
    return { today: null, open: d.portal_jobs.filter(inRegion).length, apps: (d.trackers || []).filter(inRegion).length, companies: d.companies.filter(inRegion).length, chatgpt: d.companies.filter((c) => c.scan_status !== 'Scanned').filter(inRegion).length };
  }
  const setRegion = (r) => { state.region = r; state.limit = {}; render(); };
  function go(tab, filters) { state.tab = tab; if (filters) Object.assign(state.f, filters); state.limit = {}; history.replaceState(null, '', '#' + tab); render(); window.scrollTo({ top: 0 }); }

  // ---------- data shaping ----------
  function stages() {
    const d = state.data, tr = (d.trackers || []).filter(inRegion);
    const split = (rows) => REGIONS.map((r) => [r.id, rows.filter((x) => x.region === r.id).length]).concat([['Other', rows.filter((x) => !RCOLOR[x.region]).length]]);
    const st = (names) => tr.filter((j) => names.includes(grp(j.status)));
    const open = d.portal_jobs.filter(inRegion), waiting = (d.waiting_jobs || []).filter(inRegion), scored = d.scored_jobs.filter(inRegion);
    return [
      { id: 'open', label: 'Open roles', rows: open, hint: 'at your target companies', go: () => go('open') },
      { id: 'new', label: 'New this scan', rows: waiting.concat(scored), hint: `${fmt(waiting.length)} waiting to be scored`, go: () => go('today') },
      { id: 'scored', label: 'Scored 7+', rows: scored.filter((j) => Number(j.score) >= 7), hint: 'strong matches', go: () => go('today') },
      { id: 'short', label: 'Shortlisted by you', rows: st(['Shortlisted']), hint: 'ready to apply', go: () => go('apps') },
      { id: 'applied', label: 'Applied', rows: st(['Applied']), hint: '', go: () => go('apps') },
      { id: 'int', label: 'Interviews', rows: st(['Screening', 'Interview']), hint: '', go: () => go('apps') },
      { id: 'offer', label: 'Offers', rows: st(['Offer']), hint: '', go: () => go('apps') },
    ].map((s) => ({ ...s, split: split(s.rows) }));
  }
  const lane = (split, total) => h('div', { class: 'lane', 'aria-hidden': 'true' }, total ? split.filter(([, n]) => n).map(([r, n]) => h('span', { style: { width: (n / total * 100) + '%', background: rc(r) } })) : null);

  // ---------- rows ----------
  function starBtn(key) {
    const on = saved.has(key);
    return h('button', { class: 'star', type: 'button', 'aria-pressed': String(on), 'aria-label': on ? 'Remove from saved' : 'Save job', title: on ? 'Saved' : 'Save', onclick: (e) => { e.stopPropagation(); toggleSaved(key); } }, svg(STAR.replace('<path', `<path fill="${on ? 'currentColor' : 'none'}"`), 18));
  }
  function toggleSaved(key) { if (saved.has(key)) { saved.delete(key); toast('Removed from saved'); } else { saved.add(key); toast('Saved'); } store(SAVED_KEY, saved); render(); }
  function toggleHidden(key) { if (hidden.has(key)) { hidden.delete(key); toast('Job shown again'); } else { hidden.add(key); toast('Job hidden'); } store(HIDDEN_KEY, hidden); }
  function jobRow(j, opts = {}) {
    return h('button', { class: 'row', type: 'button', onclick: () => jobDrawer(j, opts) },
      h('span', { class: 'bar', style: { background: rc(j.region) } }),
      h('span', { style: { minWidth: 0 } }, h('div', { class: 't' }, j.role), h('div', { class: 'm' }, [j.company, j.location].filter(Boolean).join(', '))),
      h('span', { class: 'r' }, opts.score && j.score != null ? h('span', { class: 'score num' }, j.score) : null, opts.when ? h('span', { class: 'when' }, opts.when(j)) : null, j.key ? starBtn(j.key) : null));
  }
  const moreBtn = (key, total, shown) => (shown < total ? h('div', { class: 'more' }, h('button', { class: 'btn quiet', type: 'button', onclick: () => { state.limit[key] = shown + 60; render(); } }, `Show ${fmt(Math.min(60, total - shown))} more of ${fmt(total - shown)}`)) : null);

  // ---------- drawer ----------
  let lastFocus = null;
  function closeDrawer() { $('#drawer-root').replaceChildren(); if (lastFocus) lastFocus.focus(); lastFocus = null; }
  function drawer(color, title, sub, body, actions) {
    lastFocus = document.activeElement;
    const close = h('button', { class: 'close', type: 'button', 'aria-label': 'Close', onclick: closeDrawer }, svg('<path d="M6 6l12 12M18 6L6 18"/>', 16));
    const panel = h('aside', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, style: { '--c': color } },
      h('header', {}, h('h2', {}, title), sub, close), h('div', { class: 'body' }, body), actions ? h('div', { class: 'actions' }, actions) : null);
    $('#drawer-root').replaceChildren(h('div', { class: 'scrim', onclick: closeDrawer }), panel);
    close.focus();
  }
  const dl = (pairs) => h('dl', {}, pairs.filter(([, v]) => v != null && v !== '').map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]));
  function jobDrawer(j, opts = {}) {
    const co = state.data.companies.find((c) => c.company === j.company);
    const link = safe(j.link);
    const isTracked = opts.tracked;
    drawer(rc(j.region), j.role,
      h('div', { class: 'muted' }, [j.company, j.location].filter(Boolean).join(', ')),
      [
        j.why ? h('div', { class: 'why' }, j.why) : null,
        dl([
          ['Region', h('span', { class: 'tag' }, h('span', { class: 'dot', style: { background: rc(j.region) } }), j.region || '')],
          ['Match score', j.score != null ? `${j.score} / 10` : null],
          ['Confidence', j.confidence], ['Eligibility', j.eligibility],
          ['Status', isTracked ? h('span', { class: 'pill ' + statusTone(j.status) }, showStatus(j.status)) : null],
          ['Source', j.source], ['Next action', j.next_action ? `${j.next_action}${j.next_action_due ? ' by ' + day(j.next_action_due) : ''}` : null],
          ['Posted', j.posted ? day(j.posted) : null], ['First seen', j.first_seen ? day(j.first_seen) : null], ['Found', j.date_found ? day(j.date_found) : null],
          ['Priority', co ? co.priority : j.priority], ['TCS BaNCS', co && co.bancs_note ? co.bancs_note : null],
        ]),
        co ? h('button', { class: 'btn quiet', type: 'button', onclick: () => { closeDrawer(); companyDrawer(co); } }, `About ${co.company}`) : null,
      ],
      [link ? h('a', { class: 'btn', href: link, target: '_blank', rel: 'noopener noreferrer' }, 'Open posting') : null,
       j.key && !isTracked ? h('button', { class: 'btn quiet' + (saved.has(j.key) ? ' on' : ''), type: 'button', onclick: () => { toggleSaved(j.key); jobDrawer(j, opts); } }, saved.has(j.key) ? 'Saved' : 'Save') : null,
       j.key && !isTracked ? h('button', { class: 'btn quiet', type: 'button', onclick: () => { toggleHidden(j.key); closeDrawer(); render(); } }, hidden.has(j.key) ? 'Show again' : 'Hide') : null,
       link ? h('button', { class: 'btn quiet', type: 'button', onclick: async () => { try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch (e) { toast('Copy did not work here: long-press the Open posting button instead'); } } }, 'Copy link') : null]);
  }
  function companyDrawer(c) {
    const roles = state.data.portal_jobs.filter((j) => j.company === c.company);
    const regs = c.regions.split(', ').filter(Boolean);
    drawer(regs.length === 1 ? rc(regs[0]) : 'var(--primary)', c.company,
      h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } }, regs.map((r) => h('span', { class: 'tag' }, h('span', { class: 'dot', style: { background: rc(r) } }), r)), h('span', { class: 'tag' }, c.priority)),
      [
        dl([['Scan status', h('span', { class: 'pill ' + coTone(c.scan_status) }, c.scan_status)], ['Platform', c.platform], ['Open roles', roles.length ? fmt(roles.length) : '0 in the latest scan'], ['Search terms', c.search_terms], ['TCS BaNCS', c.bancs_note || 'No public evidence found']]),
        roles.length ? h('div', {}, h('div', { class: 'muted', style: { fontSize: '.86rem', marginBottom: '4px' } }, 'Latest roles'), h('div', { class: 'rows' }, roles.slice(0, 6).map((j) => jobRow(j)))) : null,
      ],
      [roles.length ? h('button', { class: 'btn', type: 'button', onclick: () => { closeDrawer(); state.q = ''; $('#q').value = ''; go('open', { company: c.company }); } }, `See all ${fmt(roles.length)} roles`) : null,
       safe(c.careers_url) ? h('a', { class: 'btn quiet', href: c.careers_url, target: '_blank', rel: 'noopener noreferrer' }, 'Careers page') : null]);
  }
  const showStatus = (s) => (s === 'Shortlisted' ? 'Shortlisted by you' : s);
  const statusTone = (s) => (/^(Offer|Interview|Screening)/.test(s) ? 'ok' : /^(Applied|Shortlisted)/.test(s) ? 'ok' : /^(Rejected|Not a Fit|Withdrawn|Closed)/.test(s) ? 'muted' : 'warn');
  const coTone = (s) => ({ 'Scanned': 'ok', 'Error': 'bad', 'Blocked (needs browser)': 'warn', 'Broken link': 'warn', 'Unreachable': 'warn' }[s] || 'muted');

  // ---------- views ----------
  function viewToday() {
    const d = state.data, ss = stages();
    const pipe = h('section', { class: 'pipeline' + (state.played ? '' : ' play'), 'aria-label': 'Your job pipeline' }, ss.map((s) => h('button', { class: 'stage' + (s.rows.length ? '' : ' zero'), type: 'button', onclick: s.go },
      h('span', { class: 'label' }, s.label), h('span', { class: 'big num' }, fmt(s.rows.length)), lane(s.split, s.rows.length), h('span', { class: 'hint' }, s.hint))));
    state.played = true;
    const tr = d.trackers || [];
    const regionRow = h('section', { class: 'region-row', 'aria-label': 'Regions' }, REGIONS.map((r) => {
      const roles = d.portal_jobs.filter((j) => j.region === r.id).length;
      const mine = tr.filter((j) => j.region === r.id);
      return h('button', { class: 'rcard', type: 'button', 'aria-pressed': String(state.region === r.id), style: { '--c': r.color }, onclick: () => setRegion(state.region === r.id ? 'All' : r.id) },
        h('div', { class: 'rcard-head' }, h('strong', {}, r.id), h('span', {}, `${r.city} ${clock(r.tz)}`)),
        h('dl', {}, h('div', {}, h('dt', {}, 'Open roles'), h('dd', {}, fmt(roles))), h('div', {}, h('dt', {}, 'Tracked'), h('dd', {}, fmt(mine.length))), h('div', {}, h('dt', {}, 'Applied'), h('dd', {}, fmt(mine.filter((j) => grp(j.status) === 'Applied').length)))));
    }));
    const scored = d.scored_jobs.filter(inRegion).filter((j) => matchQ(j.role, j.company, j.location)).sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
    const waiting = (d.waiting_jobs || []).filter(inRegion).filter((j) => matchQ(j.role, j.company, j.location));

  function progressView() {
    const r = scan.running;
    const st = (name, sub, state) => h('div', { class: 'pstep ' + state }, h('span', { class: 'mark', 'aria-hidden': 'true' }, state === 'done' ? '✓' : state === 'fail' ? '!' : ''), h('span', {}, name, h('div', { class: 't2' }, sub)), null);
    const s1 = 'done';
    const s2 = r.failed === 'scan' ? 'fail' : r.scanState === 'success' ? 'done' : 'now';
    const s3 = r.failed === 'publish' ? 'fail' : r.publishState === 'success' ? 'done' : r.scanState === 'success' ? 'now' : '';
    const s4 = r.finished && !r.failed ? 'done' : '';
    const body = [h('div', { class: 'progress' },
      st('Scan requested', `${fmt(r.count)} portals, ${r.region === 'All' ? 'all regions' : r.region}`, s1),
      st('Scanning career portals', r.scanState === 'queued' || !r.scanRun ? 'Waiting for GitHub to start' : r.scanState === 'success' ? 'Finished' : r.failed === 'scan' ? 'The scan failed' : 'Running, usually 2 to 6 minutes', s2),
      st('Updating the site', s3 === 'now' ? 'Encrypting and publishing' : s3 === 'done' ? 'Published' : r.failed === 'publish' ? 'Publishing failed' : 'After the scan', s3),
      st('Ready', r.finished && !r.failed ? 'Reload to see new jobs. GitHub Pages can take a minute to switch over.' : '', s4)),
      r.netError && !r.finished ? h('p', { class: 'muted', style: { fontSize: '.86rem', margin: 0 } }, 'Lost touch with GitHub for a moment. Still checking.') : null,
      r.failed ? h('p', { class: 'note' }, 'Something went wrong. ', r.url ? h('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer' }, 'Open the run on GitHub') : null, ' to see what happened, or ask Claude to look at it.') : null,
      h('p', { class: 'muted', style: { fontSize: '.84rem', margin: 0 } }, 'You can close this window. The scan keeps running, and this window picks up where it left off when you open it again.')];
    const foot = [
      r.finished ? h('button', { class: 'btn quiet', type: 'button', onclick: () => { scan.running = null; try { localStorage.removeItem(SCAN_KEY); } catch (e) { /* ignore */ } renderScan(); } }, 'New scan') : h('span', { class: 'muted' }, 'Checking every 10 seconds'),
      r.finished && !r.failed ? h('button', { class: 'btn', type: 'button', onclick: () => { try { localStorage.removeItem(SCAN_KEY); } catch (e) { /* ignore */ } location.reload(); } }, 'Reload the site') : h('button', { class: 'btn quiet', type: 'button', onclick: closeModal }, 'Close')];
    if (!r.finished && !pollT) poll();
    return [body, foot];
  }
  $('#run-scan').addEventListener('click', openScan);

  // ---------- inputs ----------
  let qt = null;
  $('#q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; state.limit = {}; if (state.tab === 'today' && state.q) state.tab = 'open'; render(); }, 160); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modal-root').firstChild) { closeModal(); return; }
    if (e.key === 'Escape' && $('#drawer-root').firstChild) { closeDrawer(); return; }
    if (e.key === '/' && state.data && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  });
  const hash = location.hash.slice(1); if (TABS.some((t) => t.id === hash)) state.tab = hash;
  setInterval(() => { if (state.data && state.tab === 'today' && !$('#drawer-root').firstChild) document.querySelectorAll('.rcard-head span').forEach((s, i) => { s.textContent = `${REGIONS[i].city} ${clock(REGIONS[i].tz)}`; }); }, 30000);
  tryStored();
})();
</script>
</body>
</html>
